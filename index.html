<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matiere Noire · Wiki</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --paper:#F7F7F5; --ink:#14161A; --ink2:#5C6169; --ink3:#8C9199;
  --rule:#DDDEDA; --rule2:#EDEEEA; --card:#FFFFFF;
  --live:#2F6F4F; --warn:#B4711E; --stop:#A63A2B;
  --sans:"Helvetica Neue",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── en-tête ── */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;padding:12px 24px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.brand small{font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--ink3);margin-left:8px;font-size:12px}
#q{flex:1;min-width:180px;max-width:420px;border:1px solid var(--rule);background:var(--card);border-radius:3px;padding:7px 10px}
#q:focus{outline:none;border-color:var(--ink)}
.spacer{flex:1}
.lang{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--ink3)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.adm{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:3px;padding:6px 12px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--ink3)}
.btn.p{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.d{color:var(--stop)}
.btn .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── structure ── */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;max-width:1180px;padding:28px 24px 80px}
aside{font-size:14px;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
aside h3{font-size:12px;font-weight:600;color:var(--ink3);margin:0 0 6px}
aside ul{list-style:none;margin:0 0 24px;padding:0}
aside li a{display:flex;justify-content:space-between;gap:8px;padding:4px 0;text-decoration:none;color:var(--ink2)}
aside li a:hover,aside li a.on{color:var(--ink)}
aside li a.on{font-weight:600}
aside li a span{color:var(--ink3);font-variant-numeric:tabular-nums}
main{min-width:0}

/* ── accueil ── */
.hero{margin:0 0 34px;max-width:70ch}
.hero h1{font-size:44px;line-height:1.05;letter-spacing:-.02em;font-weight:600;margin:0 0 12px}
.hero p{color:var(--ink2);font-size:17px;margin:0}
.sec{margin:0 0 36px}
.sec>h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.items{list-style:none;margin:0;padding:0}
.items li{border-bottom:1px solid var(--rule2)}
.items a{display:block;padding:11px 0;text-decoration:none}
.items a:hover .it{text-decoration:underline}
.it{font-weight:600}
.ir{color:var(--ink2);font-size:14px;margin-top:2px;max-width:75ch}
.im{color:var(--ink3);font-size:12px;margin-top:3px}
.parc{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.parc a{display:block;border:1px solid var(--ink);border-radius:4px;padding:14px 16px;text-decoration:none;background:var(--card)}
.parc a:hover{background:var(--ink);color:var(--paper)}
.parc a:hover .ir,.parc a:hover .im{color:var(--rule)}
.empty{color:var(--ink2);padding:30px 0}
mark{background:#F1E6B8;color:inherit;padding:0 1px}

/* ── fiche ── */
.crumb{font-size:13px;color:var(--ink3);margin:0 0 10px}
.crumb a{color:var(--ink2)}
article{max-width:72ch}
article>h1{font-size:38px;line-height:1.1;letter-spacing:-.02em;font-weight:600;margin:0 0 12px}
.lead{font-size:18px;color:var(--ink2);margin:0 0 16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--ink3);
  padding:10px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:26px}
.chip{display:inline-block;border:1px solid var(--rule);border-radius:12px;padding:1px 9px;font-size:12px;color:var(--ink2);text-decoration:none;background:var(--card)}
a.chip:hover{border-color:var(--ink)}
.chip.tool{border-color:var(--live);color:var(--live)}
.notice{background:#FFFDF6;border:1px solid #EADFC2;border-radius:4px;padding:9px 12px;font-size:13px;color:var(--ink2);margin:0 0 18px}
.notice.err{background:#FCF3F1;border-color:#EBC9C2;color:var(--stop)}

/* contenu rendu */
.md{font-size:16px;line-height:1.65}
.md h2{font-size:23px;letter-spacing:-.01em;margin:34px 0 10px;line-height:1.2}
.md h3{font-size:18px;margin:26px 0 8px}
.md p{margin:0 0 14px}
.md a{color:var(--live);text-underline-offset:2px}
.md ul{padding-left:20px;margin:0 0 16px}
.md li{margin:3px 0}
.md img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:4px;display:block;margin:12px 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--rule2);padding:1px 5px;border-radius:3px}
.md pre{background:var(--ink);color:var(--paper);padding:14px;border-radius:4px;overflow-x:auto}
.md pre code{background:none;color:inherit;padding:0}
.md blockquote{margin:16px 0;padding:10px 14px;border-left:3px solid var(--warn);background:#FFFDF6;color:var(--ink)}
.md blockquote p:last-child{margin:0}
.md table{border-collapse:collapse;margin:0 0 16px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--rule);padding:5px 9px;text-align:left}
.md hr{border:0;border-top:1px solid var(--rule);margin:26px 0}
/* les étapes : la liste numérotée est le cœur d'un tuto */
.md ol{list-style:none;counter-reset:step;padding:0;margin:4px 0 22px}
.md ol>li{counter-increment:step;position:relative;padding:4px 0 14px 54px;margin:0;min-height:44px;border-left:1px solid var(--rule);margin-left:17px;padding-left:37px}
.md ol>li:last-child{border-left-color:transparent}
.md ol>li::before{content:counter(step);position:absolute;left:-18px;top:0;width:35px;height:35px;border-radius:50%;
  background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.md ol ol>li::before{background:var(--card);color:var(--ink);border:1px solid var(--ink)}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin:34px 0 0;padding-top:16px;border-top:1px solid var(--rule)}
.related{margin-top:30px}
.related h2{font-size:15px;margin:0 0 6px}
.pnav{display:flex;justify-content:space-between;gap:12px;margin:0 0 22px;padding:10px 14px;border:1px solid var(--ink);border-radius:4px;font-size:14px;background:var(--card);flex-wrap:wrap;align-items:center}
.pnav a{text-decoration:none;font-weight:600}
.box{border:1px solid var(--rule);background:var(--card);border-radius:4px;padding:14px;margin-top:14px}
.box textarea{width:100%;min-height:90px;border:1px solid var(--rule);border-radius:3px;padding:8px}

/* ── éditeur (Baptiste) ── */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.ed label{display:block;font-size:12px;color:var(--ink2);margin:12px 0 4px}
.ed input,.ed select,.ed textarea{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:3px;padding:7px 9px}
.ed input:focus,.ed textarea:focus,.ed select:focus{outline:none;border-color:var(--ink)}
.ed textarea.body{min-height:460px;font-family:var(--mono);font-size:13px;line-height:1.55;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:2px;margin:14px 0 0}
.tabs button{border:1px solid var(--rule);border-bottom:0;background:var(--rule2);padding:5px 12px;border-radius:3px 3px 0 0;cursor:pointer;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--card);font-weight:600}
.tb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--rule);border-bottom:0;background:var(--card)}
.tb button{border:1px solid transparent;background:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:12px}
.tb button:hover{border-color:var(--rule)}
.prev{border:1px dashed var(--rule);border-radius:4px;padding:18px;background:var(--card);max-height:820px;overflow:auto;position:sticky;top:76px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools label{display:inline-flex;gap:5px;align-items:center;margin:0;border:1px solid var(--rule);border-radius:12px;padding:2px 9px;font-size:12px;cursor:pointer;background:var(--card)}
.tools input{width:auto}
.edbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.hint{font-size:12px;color:var(--ink3);margin:4px 0 0}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;color:var(--ink3);font-weight:500;border-bottom:1px solid var(--rule);padding:6px 8px}
table.list td{border-bottom:1px solid var(--rule2);padding:8px;vertical-align:top}
.porder li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule2)}
.porder li span{flex:1}

/* ── checklists direction ── */
.bar{height:4px;background:var(--rule2);border-radius:2px;margin:6px 0 4px;max-width:420px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--live)}
.bar.big{height:8px;max-width:none;margin:0 0 10px}
ul.ck{list-style:none;margin:0;padding:0}
ul.ck li{border-bottom:1px solid var(--rule2)}
ul.ck label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
ul.ck input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--live)}
ul.ck li.done span{color:var(--ink3)}
ul.ck small{display:block;font-size:12px;color:var(--live);margin-top:2px}

/* ── accueil : deux choix ── */
.choix{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 36px;max-width:900px}
.choix a{display:flex;flex-direction:column;gap:8px;min-height:190px;padding:24px 26px;border:1px solid var(--ink);border-radius:4px;
  text-decoration:none;background:var(--card);position:relative}
.choix a:hover{background:var(--ink);color:var(--paper)}
.choix a:hover .cp{color:var(--rule)}
.choix .ct{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.choix .cp{color:var(--ink2);font-size:15px;max-width:34ch}
.choix .cn{margin-top:auto;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink3)}
.profils{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 20px;font-size:14px}
.profils span{color:var(--ink2);margin-right:4px}
.profils button{border:1px solid var(--rule);background:var(--card);border-radius:14px;padding:4px 12px;cursor:pointer;font-size:13px}
.profils button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ofr{border:1px solid var(--rule);border-radius:4px;background:#fff;height:calc(100vh - 200px);min-height:520px;overflow:hidden}
.ofr iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.ofr:fullscreen{height:100vh;border:0;border-radius:0}
@media (max-width:860px){.choix{grid-template-columns:1fr}.choix a{min-height:140px}.choix .ct{font-size:26px}}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal>div{background:var(--paper);border-radius:4px;max-width:760px;width:100%;padding:22px 24px}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:18px;padding-top:18px}
  aside{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:0 26px}
  aside ul{margin-bottom:10px}
  .hero h1{font-size:34px} article>h1{font-size:30px}
  .ed{grid-template-columns:1fr} .prev{position:static}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{
  header,aside,.actions,.pnav,.related,#toast,.box{display:none!important}
  .layout{display:block;padding:0} body{background:#fff}
  .md ol>li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="#">Wiki<small>Matiere Noire</small></a>
  <input id="q" type="search" autocomplete="off">
  <span class="spacer"></span>
  <div class="adm" id="adm"></div>
  <div class="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getDatabase,ref,onValue,get,set,update,push,remove} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const CFG={apiKey:"AIzaSyByf4SmnGJvfkkJVFhfINXikb8I8ge5VRU",
  authDomain:"matiere-noire-todo.firebaseapp.com",
  databaseURL:"https://matiere-noire-todo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"matiere-noire-todo",storageBucket:"matiere-noire-todo.firebasestorage.app",
  messagingSenderId:"583651643354",appId:"1:583651643354:web:74b78c43316b9d657dfae3"};
const db=getDatabase(initializeApp(CFG));

/* ═══ MN-GATE v1 — connexion Google obligatoire, liste d'accès /acces ═══
   Bloc identique dans tous les outils : à modifier partout à la fois.
   Session conservée par Firebase (même domaine) : une connexion vaut pour tous les outils. */
async function mnGate(){
  const B='https://www.gstatic.com/firebasejs/10.12.0/';
  const [F,A,D]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-database.js')]);
  const app=F.getApp(), auth=A.getAuth(app), db=D.getDatabase(app);
  const g=document.createElement('div'); g.id='mn-gate';
  g.innerHTML=`<style>
#mn-gate{position:fixed;inset:0;z-index:2147483000;background:#F7F7F5;color:#14161A;display:flex;align-items:center;justify-content:center;
  font-family:"Helvetica Neue",Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;padding:24px;box-sizing:border-box}
#mn-gate .mg{max-width:380px;width:100%}
#mn-gate .mg-t{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
#mn-gate .mg-s{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:#8C9199;margin:0 0 22px}
#mn-gate .mg-m{margin:0 0 16px;color:#5C6169}
#mn-gate .mg-m b{color:#14161A;font-weight:600}
#mn-gate .mg-m.err{color:#A63A2B}
#mn-gate button{font:inherit;font-size:13px;border:1px solid #14161A;background:#14161A;color:#F7F7F5;border-radius:3px;padding:8px 16px;cursor:pointer;margin:0 8px 8px 0}
#mn-gate button.sec{background:transparent;color:#14161A;border-color:#DDDEDA}
#mn-gate button:hover{opacity:.85}
</style><div class="mg"><div class="mg-t">Matiere Noire</div><div class="mg-s"></div><div class="mg-m"></div><div class="mg-a"></div></div>`;
  document.body.appendChild(g);
  g.querySelector('.mg-s').textContent=document.title||'';
  const msg=(h,err)=>{const m=g.querySelector('.mg-m');m.innerHTML=h;m.className='mg-m'+(err?' err':'');};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const btns=list=>{const a=g.querySelector('.mg-a');a.innerHTML='';
    list.forEach(([t,f,sec])=>{const b=document.createElement('button');b.textContent=t;if(sec)b.className='sec';b.onclick=f;a.appendChild(b);});};
  const login=async()=>{
    try{const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await A.signInWithPopup(auth,p);}
    catch(e){
      if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'))return;
      msg(location.protocol==='file:'
        ?'Connexion impossible depuis un fichier local : ouvrez la page en ligne.'
        :e&&e.code==='auth/popup-blocked'
          ?'La fenêtre de connexion a été bloquée par le navigateur. Autorisez les pop-ups pour ce site, puis réessayez.<br>Pop-up blocked: allow pop-ups for this site and retry.'
          :'Connexion impossible · Sign-in failed<br><small>'+esc(e&&(e.code||e.message))+'</small>',true);
    }
  };
  const ecranConnexion=()=>{msg('Connectez-vous avec votre compte <b>@matiere-noire.paris</b>.<br>Sign in with your Matiere Noire Google account.');
    btns([['Se connecter avec Google · Sign in',login]]);};
  msg('Chargement…'); btns([]);
  return new Promise(resolve=>{
    let ok=false;
    A.onAuthStateChanged(auth,async u=>{
      if(ok){ if(!u) location.reload(); return; }      // déconnexion après ouverture : on revient à l'écran de connexion
      if(!u){ecranConnexion();return;}
      msg('Vérification de l’accès…'); btns([]);
      const email=(u.email||'').toLowerCase();
      let autorise=false, erreur=null;
      try{
        autorise=!!u.emailVerified && (await D.get(D.ref(db,'acces/'+email.replace(/\./g,',')))).exists();
      }catch(e){
        if(!/permission/i.test(e&&e.message||'')) erreur=e;  // permission refusée = compte non autorisé
      }
      if(autorise){ok=true;g.remove();resolve(u);return;}
      if(erreur){msg('Impossible de vérifier l’accès (connexion internet ?) · Could not check access.<br><small>'+esc(erreur.message)+'</small>',true);
        btns([['Réessayer · Retry',()=>location.reload()],['Changer de compte',login,true]]);return;}
      msg('<b>'+esc(email)+'</b> n’a pas accès à la plateforme. Demandez l’accès à Baptiste.<br>This account has no access. Ask Baptiste.',true);
      btns([['Changer de compte · Switch account',login],['Se déconnecter',()=>A.signOut(auth),true]]);
    });
  });
}
/* ═══ fin MN-GATE v1 ═══ */

const mnUser=await mnGate();
const ME=(mnUser.email||'').toLowerCase();
const EDITEUR='baptiste@matiere-noire.paris';
const EDIT=ME===EDITEUR;                       // seul Baptiste écrit (les règles l'imposent aussi)
const DIRECTION=['baptiste@matiere-noire.paris','felix@matiere-noire.paris','pierre@matiere-noire.paris','sam@matiere-noire.paris'].includes(ME);

/* ═══ textes de l'interface (lecture FR / EN ; l'édition est en français) ═══ */
const T={
 fr:{search:'Rechercher une fiche…',heroT:'Comment on fait, au studio',
  heroP:'Les fiches pratiques de Matiere Noire : nos outils, nos démarches, notre matériel.',
  parcours:'Parcours',categories:'Catégories',tout:'Toutes les fiches',recent:'Mises à jour récemment',
  majLe:d=>'Mise à jour le '+d, fiches:n=>n+' fiche'+(n>1?'s':''),
  vide:'Les premières fiches arrivent bientôt.',aucun:q=>'Aucune fiche ne correspond à « '+q+' ».',
  resultats:n=>n+' résultat'+(n>1?'s':''),introuvable:'Cette fiche n’existe pas ou a été archivée.',retour:'Retour à l’accueil',
  frSeul:'Cette fiche n’existe qu’en français.',enSeul:'',
  copier:'Copier le lien',copie:'Lien copié',imprimer:'Imprimer ou PDF',signaler:'Signaler une erreur',
  signalerT:'Une erreur, une étape qui manque, une question ? Baptiste recevra ton message.',
  envoyer:'Envoyer',annuler:'Annuler',envoye:'Merci, ton message a été envoyé.',liees:'Fiches qui renvoient ici',
  outils:'Outils concernés',etape:(i,n)=>'Étape '+i+' sur '+n,suivante:'Fiche suivante',precedente:'Précédente',

function slugify(s){
  let x=norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'fiche';
  if(RESERVES.some(r=>x===r||x.startsWith(r+'-'))||/^comment-/.test(x)) x='fiche-'+x;
  return x;
}
function addMonths(iso,n){const d=new Date(iso+'T12:00:00');d.setMonth(d.getMonth()+Number(n||6));return d.toISOString().slice(0,10);}

/* ═══ rendu markdown ═══
   [[slug]] ou [[slug|texte]] → lien vers une fiche ; ![légende](img:ID) → image stockée dans wikiImages */
function md(src,lang=L){
  let s=String(src||'');
  s=s.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g,(m,sl,lab)=>{const f=parSlug(sl);return `[${(lab||(f?tr(f.titre,lang):sl)).replace(/[\[\]]/g,'')}](#${sl})`;});
  s=s.replace(/\]\(img:([A-Za-z0-9_-]+)\)/g,'](#img-$1)');
  let html;
  if(window.marked&&window.DOMPurify){
    html=DOMPurify.sanitize(marked.parse(s,{gfm:true,breaks:true}));
  }else{                                          // repli si les librairies n'ont pas chargé
    html=s.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
  }
  return html;
}
async function hydrate(root){
  root.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
  const imgs=[...root.querySelectorAll('img[src^="#img-"]')];
  await Promise.all(imgs.map(async im=>{
    const id=im.getAttribute('src').slice(5);
    if(!(id in IMG)){try{IMG[id]=((await get(ref(db,'wikiImages/'+id))).val()||{}).data||null;}catch(_){IMG[id]=null;}}
    if(IMG[id]) im.src=IMG[id]; else {im.alt='(image introuvable)';im.removeAttribute('src');}
  }));
}

/* ═══ navigation (hash = #slug d'une fiche, ou #parcours-<id>) ═══ */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h){ if(!['cat','search','retours','relire','archives','historique','checklists','suivi','modele','oedit'].includes(vue.k)) vue={k:'home'}; }
  else if(h==='outils') vue={k:'outils'};
  else if(h==='parcours') vue={k:'plist'};
  else if(h.startsWith('outil-')) vue={k:'outil',slug:h.slice(6)};
  else if(h.startsWith('parcours-')) vue={k:'parcours',id:h.slice(9)};
  else vue={k:'fiche',slug:h};
  render();
}

function vSearch(){
  const mots=norm(q).split(/\s+/).filter(Boolean);
  const res=actives().map(f=>{
    const ti=norm(tr(f.titre)+' '+tr(f.titre,'fr')), re=norm(tr(f.resume)), co=norm(tr(f.contenu)+' '+tr(f.contenu,'fr')), tg=norm((f.tags||[]).join(' ')+' '+(f.categorie||''));
    if(!mots.every(m=>ti.includes(m)||re.includes(m)||co.includes(m)||tg.includes(m))) return null;
    const sc=mots.reduce((s,m)=>s+(ti.includes(m)?10:0)+(tg.includes(m)?5:0)+(re.includes(m)?3:0)+(co.includes(m)?1:0),0);
    return {f,sc};
  }).filter(Boolean).sort((a,b)=>b.sc-a.sc);
  const hl=s=>{let h=esc(s);mots.forEach(m=>{if(m.length<2)return;const re=new RegExp('('+m.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');h=h.replace(re,'<mark>$1</mark>');});return h;};
  $('#main').innerHTML=`<div class="sec"><h2>${esc(t().resultats(res.length))}</h2>
    ${res.length?`<ul class="items">${res.map(({f})=>`<li><a href="#${esc(f.slug)}"><div class="it">${hl(tr(f.titre))}</div>

function signaler(f){

/* redimensionne (1600 px max) et compresse jusqu'à ~350 Ko, pour ne pas alourdir la base */
async function compresser(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('fichier illisible'));i.src=url;});
  let w=img.naturalWidth,h=img.naturalHeight,max=1600,q=.82,out='';
  for(let n=0;n<6;n++){
    const r=Math.min(1,max/Math.max(w,h)), c=document.createElement('canvas');
    c.width=Math.round(w*r);c.height=Math.round(h*r);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL('image/webp',q); if(!out.startsWith('data:image/webp')) out=c.toDataURL('image/jpeg',q);
    if(out.length*0.75<=350000) break;
    q-=.12; max=Math.round(max*.85);
  }
  URL.revokeObjectURL(url);
  if(out.length*0.75>600000) throw new Error('image trop lourde même après compression');
  return out;
}

  if(pris){alert('L’adresse « '+slug+' » est déjà utilisée par « '+tr(pris.titre,'fr')+' ». Choisis-en une autre.');return;}
  const now=Date.now(), id=E.id||uid('f');
  const f={id,slug,titre:E.titre,resume:E.resume,contenu:E.contenu,categorie:(E.categorie||'').trim()||'Autre',
    tags:E.tags||[],outils:E.outils||[],relireMois:Number(E.relireMois||6),relireLe:addMonths(today(),E.relireMois||6),
    archive:!!(src&&src.archive),creeLe:(src&&src.creeLe)||now,majLe:now,majPar:ME};

    <p class="hint" style="margin:-8px 0 12px">Une suite de fiches à lire dans l’ordre, par exemple pour l’arrivée d’un stagiaire. Chacun voit sa progression sur son ordinateur.</p>
    <div class="ed" style="grid-template-columns:1fr"><div>
      <div class="two"><div><label>Titre (FR)</label><input id="pe-tfr" value="${esc(P.titre.fr)}" placeholder="ex. Arrivée au studio"></div>
        <div><label>Titre (EN)</label><input id="pe-ten" value="${esc(P.titre.en)}" placeholder="ex. Joining the studio"></div></div>
      <div class="two"><div><label>Description (FR)</label><input id="pe-dfr" value="${esc(P.description.fr)}"></div>
        <div><label>Description (EN)</label><input id="pe-den" value="${esc(P.description.en)}"></div></div>
      <label>Fiches, dans l’ordre</label>
      ${P.profils?'<p class="hint" style="margin:0 0 6px">Coche pour quels profils chaque fiche s’affiche (toutes cochées = tout le monde).</p>':''}
      <ol class="porder" style="list-style:decimal;padding-left:22px">${P.fiches.map((id,i)=>`<li><span>${esc(FICHES[id]?tr(FICHES[id].titre,'fr'):'(fiche supprimée)')}
        ${P.profils?`<span class="tools" style="margin-top:4px">${P.profils.map(x=>`<label><input type="checkbox" data-pub="${esc(id)}" value="${esc(x.k)}"${!(P.publics&&P.publics[id])||P.publics[id].includes(x.k)?' checked':''}>${esc(x.fr)}</label>`).join('')}</span>`:''}</span>
        <button class="btn" data-up="${i}"${i?'':' disabled'}>Monter</button><button class="btn" data-dn="${i}"${i<P.fiches.length-1?'':' disabled'}>Descendre</button>
        <button class="btn d" data-rm="${i}">Retirer</button></li>`).join('')||'<li style="list-style:none;color:var(--ink3)">Aucune fiche.</li>'}</ol>
      <div class="two" style="margin-top:10px"><select id="pe-add"><option value="">Ajouter une fiche…</option>${dispo.map(f=>`<option value="${esc(f.id)}">${esc(tr(f.titre,'fr'))}</option>`).join('')}</select></div>
    </div></div>`;
  const b=(s,fn)=>{$(s).oninput=e=>fn(e.target.value);};
  b('#pe-tfr',v=>P.titre.fr=v);b('#pe-ten',v=>P.titre.en=v);b('#pe-dfr',v=>P.description.fr=v);b('#pe-den',v=>P.description.en=v);
  $('#pe-add').onchange=e=>{if(e.target.value){P.fiches.push(e.target.value);vPEdit();}};
  $('#main').querySelectorAll('[data-pub]').forEach(c=>c.onchange=()=>{
    const id=c.dataset.pub, ks=[...$('#main').querySelectorAll(`[data-pub="${id}"]:checked`)].map(x=>x.value);
    P.publics=P.publics||{}; if(ks.length===P.profils.length) delete P.publics[id]; else P.publics[id]=ks;
  });
  $('#main').querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{const i=+x.dataset.up;[P.fiches[i-1],P.fiches[i]]=[P.fiches[i],P.fiches[i-1]];vPEdit();});
  $('#main').querySelectorAll('[data-dn]').forEach(x=>x.onclick=()=>{const i=+x.dataset.dn;[P.fiches[i+1],P.fiches[i]]=[P.fiches[i],P.fiches[i+1]];vPEdit();});
  $('#main').querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{P.fiches.splice(+x.dataset.rm,1);vPEdit();});
  $('#pe-x').onclick=()=>{P=null;src?(location.hash='parcours-'+vue.id,route()):go('home');};
  $('#pe-ok').onclick=async()=>{
    if(!P.titre.fr.trim()){alert('Le titre en français est obligatoire.');return;}
    const id=vue.id||uid('p'); const {_for,...data}=P;
    try{await set(ref(db,'wiki/parcours/'+id),{...data,majLe:Date.now()});P=null;toast('Parcours enregistré');location.hash='parcours-'+id;route();}
    catch(e){alert('Non enregistré : '+e.message);}
  };
  const d=$('#pe-del'); if(d) d.onclick=async()=>{
    if(!confirm('Supprimer ce parcours ? Les fiches ne sont pas touchées.'))return;
    try{await remove(ref(db,'wiki/parcours/'+vue.id));P=null;history.replaceState(null,'',location.pathname);go('home');}catch(e){alert(e.message);}
  };
}

 {slug:'poste-referent-et-communication',outils:[],tags:['accueil','poste','whatsapp'],

  contenu:{fr:`## Poste de travail

 {slug:'fireflies-enregistrer-une-visio',outils:[],tags:['fireflies','réunion','visio','compte rendu'],categorie:'Outils du studio',
  titre:{fr:'Fireflies : enregistrer une visio et recevoir les notes',en:'Fireflies: recording a video call and getting the notes'},
  resume:{fr:'Fred, le bot Fireflies, rejoint nos visios, les enregistre et rédige les notes.',en:'Fred, the Fireflies bot, joins our video calls, records them and writes the notes.'},
  contenu:{fr:`Fireflies est un bot qui rejoint nos visios, les enregistre et rédige les notes à notre place. Il y a deux façons de l’ajouter.

## Option 1 — Réunion planifiée (le plus souvent), pour tout le monde
1. Crée ton invitation d’agenda comme d’habitude, avec le lien Google Meet, Zoom ou Teams.
2. Ajoute **fred@fireflies.ai** comme invité.
3. Envoie l’invitation.
4. C’est tout : Fred, le bot Fireflies, rejoindra la réunion à l’heure.

## Option 2 — Réunion déjà commencée (ou Fred oublié), pour Pierre, Félix, Sam et Baptiste
1. Copie le lien de la visio.
2. Ouvre https://app.fireflies.ai/
3. Clique sur **Add to live meeting** et colle le lien.
4. Fred rejoint la réunion en moins d’une minute.

> Réservé à la direction : il faut être connecté avec **admin@matiere-noire.paris** pour accéder à la plateforme Fireflies.

## Bon à savoir
- **Salle d’attente** : si Fred attend d’être admis, fais-le entrer comme n’importe quel invité.
- **Préviens les participants** : Fred est visible par tout le monde. Avec un client, dis en début d’appel que la réunion est enregistrée.
- **Tes notes** : la transcription et le résumé arrivent par mail et sur app.fireflies.ai quelques minutes après l’appel, envoyés à toutes les adresses @matiere-noire.paris invitées à la réunion.`,
   en:`Fireflies is a bot that joins our video calls, records them and writes the notes for us. There are two ways to add it.

## Option 1 — Planned meeting (most of the time), for everyone
1. Create your calendar invite as usual, with the Google Meet, Zoom or Teams link included.
2. Add **fred@fireflies.ai** as a guest.
3. Send the invite.
4. Done: Fred, the Fireflies bot, will join on time.

## Option 2 — Meeting already started (or Fred forgotten), for Pierre, Felix, Sam and Baptiste
1. Copy the video call link.
2. Open https://app.fireflies.ai/
3. Click **Add to live meeting** and paste the link.
4. Fred joins within a minute.

> Management team only: you need to be logged in as **admin@matiere-noire.paris** to access the Fireflies platform.

## Good to know
- **Waiting room**: if Fred is waiting to be let in, admit him like any guest.
- **Tell people**: Fred is visible to everyone. With clients, say at the start that the call is recorded.
- **Your notes**: the transcript and summary arrive by email and on app.fireflies.ai a few minutes after the call, sent to every @matiere-noire.paris address invited to the call.`}},

hadow:0 0 0 2px #5865f2,0 4px 24px #0008}\n#canvas-wrap.selecting{cursor:crosshair}\ncanvas{display:block}\n#drop-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:.5}\n#drop-hint p{font-size:14px;color:#888;margin-top:8px}\n#duration-label{font-size:12px;color:#666;text-align:center}\n.grid-row{display:flex;gap:6px;align-items:center}\n.grid-row select{flex:1}\n#sel-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}\n#sel-rect{position:absolute;top:0;height:100%;background:rgba(88,101,242,0.18);border:1.5px solid #5865f2;display:none;pointer-events:none}\n#zoom-panel{background:#111;border-radius:8px;box-shadow:0 4px 24px #0008;overflow:hidden;display:none;flex-direction:column;position:relative;flex-shrink:0;max-width:100%;align-self:center}\n#zoom-panel-header{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#1a1a1a;border-bottom:1px solid #333;font-size:11px;color:#666;white-space:nowrap;gap:12px}\n#zoom-close{background:none;border:none;color:#888;cursor:pointer;font-size:16px;line-height:1;padding:0 2px;flex-shrink:0}\n#zoom-close:hover{color:#e0e0e0}\n#zoom-canvas-wrap{overflow:hidden;display:flex;align-items:stretch}\n#zoom-canvas{display:block}\n<\/style>\n<\/head>\n<body>\n<div id=\"sidebar\">\n  <h1>MN Waveform Generator <span style=\"color:#555;font-weight:400\">v1.9<\/span><\/h1>\n\n  <div class=\"group\">\n    <label>Fichier audio<\/label>\n    <label class=\"btn-upload\" id=\"upload-btn\">\n      <svg width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12\"/><\/svg>\n      Charger un fichier audio\n      <input type=\"file\" id=\"file-input\" accept=\"audio/*\" style=\"display:none\">\n    <\/label>\n    <div id=\"duration-label\">—<\/div>\n  <\/div>\n\n  <div class=\"group\">\n    <label>Dimensions (px)<\/label>\n    <div class=\"row\">\n      <input type=\"number\" id=\"w\" value=\"4500\" min=\"100\" max=\"9999\" oninput=\"updateCanvas()\">\n      <span>×<\/span>\n      <input type=\"number\" id=\"h\" value=\"400\" min=\"40\" max=\"2000\" oninput=\"updateCanvas()\">\n    <\/div>\n    <div class=\"grid-row\">\n      <span class=\"sublabel\" style=\"white-space:nowrap\">Répétitions<\/span>\n      <input type=\"number\" id=\"repeat-count\" value=\"1\" min=\"1\" max=\"20\" oninput=\"updateCanvas()\" style=\"width:64px;background:#1a1a1a;border:1px solid #444;border-radius:6px;padding:6px 8px;color:#e0e0e0;font-size:13px;margin-left:auto\">\n    <\/div>\n  <\/div>\n\n  <div class=\"group\">\n    <label>Style de waveform<\/label>\n    <select id=\"waveform-style\" onchange=\"updateCanvas()\">\n      <option value=\"mirror\">Miroir (haut + bas)<\/option>\n      <option value=\"top\">Vers le haut seulement<\/option>\n      <option value=\"filled\">Remplie / filled<\/option>\n    <\/select>\n  <\/div>\n\n  <div class=\"group\">\n    <label>Grille temporelle<\/label>\n    <div class=\"grid-row\">\n      <span class=\"sublabel\" style=\"white-space:nowrap\">Grille<\/span>\n      <select id=\"grid-unit\" style=\"flex:1;margin-left:6px\" onchange=\"updateCanvas()\">\n        <option value=\"s\">Secondes<\/option>\n        <option value=\"m\" selected>Minutes<\/option>\n        <option value=\"h\">Heures<\/option>\n      <\/select>\n      <span class=\"sublabel\">tous les<\/span>\n      <input type=\"number\" id=\"grid-interval\" value=\"1\" min=\"1\" max=\"3600\" oninput=\"updateCanvas()\" style=\"width:64px;background:#1a1a1a;border:1px solid #444;border-radius:6px;padding:6px 8px;color:#e0e0e0;font-size:13px\">\n    <\/div>\n    <div class=\"grid-row\" style=\"margin-top:2px\">\n      <span class=\"sublabel\" style=\"white-space:nowrap\">Intervals<\/span>\n      <select id=\"ticks-unit\" style=\"flex:1;margin-left:6px\" onchange=\"updateCanvas()\">\n        <option value=\"s\" selected>Secondes<\/option>\n        <option value=\"m\">Minutes<\/option>\n        <option value=\"h\">Heures<\/option>\n      <\/select>\n      <span class=\"sublabel\">tous les<\/span>\n      <input type=\"number\" id=\"ticks-interval\" value=\"10\" min=\"1\" max=\"3600\" oninput=\"updateCanvas()\" style=\"width:64px;background:#1a1a1a;border:1px solid #444;border-radius:6px;padding:6px 8px;color:#e0e0e0;font-size:13px\">\n    <\/div>\n  <\/div>\n\n  <div class=\"group\">\n    <label>Apparence<\/label>\n    <div style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span class=\"sublabel\" style=\"min-width:64px\">Fond<\/span>\n      <input type=\"color\" id=\"bg-color\" value=\"#000000\" style=\"flex:1\" oninput=\"updateCanvas()\">\n    <\/div>\n    <div style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span class=\"sublabel\" style=\"min-width:64px\">Waveform<\/span>\n      <input type=\"color\" id=\"wave-color\" value=\"#888888\" style=\"flex:1\" oninput=\"updateCanvas()\">\n    <\/div>\n    <div style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span class=\"sublabel\" style=\"min-width:64px\">Grille<\/span>\n      <input type=\"color\" id=\"grid-color\" value=\"#ffffff\" style=\"flex:1\" oninput=\"updateCanvas()\">\n    <\/div>\n  <\/div>\n\n  <div class=\"group\">\n    <div style=\"display:flex;align-items:center;gap:0\">\n      <label style=\"margin:0;white-space:nowrap;font-size:13px;font-weight:600;color:#ccc\">Texte<\/label>\n      <div style=\"display:flex;align-items:center;gap:4px;margin-left:28px;flex:1\">\n        <input type=\"range\" id=\"font-size\" min=\"6\" max=\"72\" value=\"25\" style=\"flex:1;min-width:0\" oninput=\"document.getElementById('font-size-num').value=this.value;updateCanvas()\">\n        <input type=\"number\" id=\"font-size-num\" value=\"25\" min=\"6\" max=\"72\" oninput=\"var v=Math.min(72,Math.max(6,+this.value||25));document.getElementById('font-size').value=v;updateCanvas()\" style=\"width:44px;background:#1a1a1a;border:1px solid #444;border-radius:6px;padding:4px 6px;color:#e0e0e0;font-size:12px;text-align:center\">\n        <span class=\"sublabel\">px<\/span>\n      <\/div>\n    <\/div>\n    <label class=\"check-label\">\n      <input type=\"checkbox\" id=\"grid-visible\" checked style=\"accent-color:#5865f2\" onchange=\"updateCanvas()\"> Afficher la grille\n    <\/label>\n    <label class=\"check-label\">\n      <input type=\"checkbox\" id=\"ticks-visible\" checked style=\"accent-color:#5865f2\" onchange=\"updateCanvas()\"> Afficher les intervals\n    <\/label>\n    <label class=\"check-label\">\n      <input type=\"checkbox\" id=\"filename-visible\" checked style=\"accent-color:#5865f2\" onchange=\"updateCanvas()\"> Afficher le nom de la piste\n    <\/label>\n  <\/div>\n\n  <div class=\"group\" style=\"margin-top:auto;padding-top:8px;border-top:1px solid #333;display:flex;flex-direction:column;gap:8px\">\n    <button class=\"btn-export btn-svg\" id=\"export-svg\">Exporter SVG<\/button>\n    <button class=\"btn-export btn-png\" id=\"export-png\">Exporter PNG<\/button>\n  <\/div>\n<\/div>\n\n<div id=\"main\">\n  <div id=\"zoom-panel\">\n    <div id=\"zoom-panel-header\">\n      <span id=\"zoom-label\">Zoom sélection<\/span>\n      <button id=\"zoom-close\">✕<\/button>\n    <\/div>\n    <div id=\"zoom-canvas-wrap\">\n      <canvas id=\"zoom-canvas\"><\/canvas>\n    <\/div>\n  <\/div>\n  <div id=\"canvas-wrap\">\n    <canvas id=\"wc\"><\/canvas>\n    <div id=\"sel-overlay\"><div id=\"sel-rect\"><\/div><\/div>\n    <div id=\"drop-hint\">\n      <svg width=\"48\" height=\"48\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.5\" viewBox=\"0 0 24 24\"><path d=\"M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-3c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z\"/><\/svg>\n      <p>Chargez ou déposez un fichier audio<br>pour commencer<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst canvas = document.getElementById('wc');\nconst ctx = canvas.getContext('2d');\nconst MAX_W = Math.round((window.innerWidth - 280) * 0.9);\nlet peaks = null, audioDuration = 0, audioFilename = '';\n\nfunction getParams() {\n  return {\n    w: Math.max(100, +document.getElementById('w').value || 4500),\n    h: Math.max(40, +document.getElementById('h').value || 400),\n    repeat: Math.max(1, +document.getElementById('repeat-count').value || 1),\n    style: document.getElementById('waveform-style').value,\n    bgColor: document.getElementById('bg-color').value,\n    waveColor: document.getElementById('wave-color').value,\n    gridColor: document.getElementById('grid-color').value,\n    gridVisible: document.getElementById('grid-visible').checked,\n    ticksVisible: document.getElementById('ticks-visible').checked,\n    filenameVisible: document.getElementById('filename-visible').checked,\n    gridInterval: +document.getElementById('grid-interval').value || 1,\n    gridUnit: document.getElementById('grid-unit').value,\n    ticksInterval: +document.getElementById('ticks-interval').value || 10,\n    ticksUnit: document.getElementById('ticks-unit').value,\n    fontSize: +document.getElementById('font-size').value || 25\n  };\n}\n\nfunction intervalSec(unit, val) {\n  return unit === 'h' ? val * 3600 : unit === 'm' ? val * 60 : val;\n}\n\nfunction fmtTime(t, gridUnit) {\n  if (gridUnit === 'h' || t >= 3600)\n    return `${Math.floor(t/3600)}:${String(Math.floor((t%3600)/60)).padStart(2,'0')}:${String(Math.round(t%60)).padStart(2,'0')}`;\n  if (gridUnit === 'm' || t >= 60)\n    return `${Math.floor(t/60)}:${String(Math.round(t%60)).padStart(2,'0')}`;\n  return `${Math.round(t)}s`;\n}\n\nfunction hexToRgba(hex, a) {\n  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);\n  return `rgba(${r},${g},${b},${a})`;\n}\n\nfunction computePeaks(channelData, samples) {\n  const p = [], blockSize = Math.floor(channelData.length / samples);\n  for (let i = 0; i < samples; i++) {\n    let max = 0, offset = i * blockSize;\n    for (let j = 0; j < blockSize; j++) { const v = Math.abs(channelData[offset+j]||0); if(v>max) max=v; }\n    p.push(max);\n  }\n  return p;\n}\n\n// Core render — draws everything into any context at full resolution\nfunction renderToContext(cx, W, H, p) {\n  const sliceW = W / p.repeat;\n  const totalDur = audioDuration * p.repeat;\n  const gIntervalSec = intervalSec(p.gridUnit, p.gridInterval);\n  const tIntervalSec = intervalSec(p.ticksUnit, p.ticksInterval);\n  const tickH = Math.round(H * 0.125);\n\n  // Background\n  cx.fillStyle = p.bgColor;\n  cx.fillRect(0, 0, W, H);\n\n  // Waveform — N slices\n  if (peaks && peaks.length > 0) {\n    const samples = peaks.length;\n    cx.fillStyle = p.waveColor;\n    for (let r = 0; r < p.repeat; r++) {\n      const ox = r * sliceW;\n      for (let i = 0; i < samples; i++) {\n        const x = ox + Math.round((i / samples) * sliceW);\n        const bw = Math.max(1, Math.ceil(sliceW / samples));\n        const amp = peaks[i] * H * 0.9;\n        if (p.style === 'mirror') { const hh=amp/2; cx.fillRect(x, H/2-hh, bw, Math.max(1,amp)); }\n        else if (p.style === 'top') { cx.fillRect(x, H-amp, bw, Math.max(1,amp)); }\n        else { cx.fillRect(x, 0, bw, Math.max(1,amp)); }\n      }\n    }\n  }\n\n  // Grid\n  if (p.gridVisible && audioDuration > 0) {\n    cx.font = `${p.fontSize}px system-ui`;\n\n    // Ticks (intervals)\n    if (p.ticksVisible) {\n      cx.strokeStyle = hexToRgba(p.gridColor, 0.5); cx.lineWidth = 0.5;\n      let t = 0;\n      while (t <= totalDur + tIntervalSec * 0.01) {\n        const onMain = Math.round(t / gIntervalSec) * gIntervalSec;\n        if (Math.abs(t - onMain) > tIntervalSec * 0.01) {\n          const x = Math.round((t / totalDur) * W);\n          cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,tickH); cx.stroke();\n        }\n        t += tIntervalSec;\n      }\n    }\n\n    // Main grid lines + labels\n    cx.strokeStyle = p.gridColor; cx.lineWidth = 1; cx.fillStyle = p.gridColor;\n    let t = 0;\n    while (t <= totalDur + gIntervalSec * 0.01) {\n      const x = Math.round((t / totalDur) * W);\n      cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke();\n      cx.fillText(fmtTime(t, p.gridUnit), x+3, p.fontSize+2);\n      t += gIntervalSec;\n    }\n  }\n\n  // Filename\n  if (p.filenameVisible && audioFilename) {\n    cx.font = `${p.fontSize}px system-ui`; cx.fillStyle = p.gridColor;\n    cx.fillText(audioFilename, 6, H-6);\n  }\n}\n\nfunction renderMain() {\n  const p = getParams();\n  const scale = Math.min(1, MAX_W / p.w);\n  canvas.width = Math.round(p.w * scale);\n  canvas.height = Math.round(p.h * scale);\n  canvas.style.width = canvas.width + 'px';\n  canvas.style.height = canvas.height + 'px';\n  ctx.setTransform(scale, 0, 0, scale, 0, 0);\n  renderToContext(ctx, p.w, p.h, p);\n}\n\nfunction updateCanvas() {\n  renderMain();\n  if (zoomPanel.style.display === 'flex' && dragStart !== null && dragEnd !== null) renderZoom();\n}\n\n// ── Zoom ─────────────────────────────────────────────────────\nconst wrap = document.getElementById('canvas-wrap');\nconst selRect = document.getElementById('sel-rect');\nconst zoomPanel = document.getElementById('zoom-panel');\nconst zoomCanvas = document.getElementById('zoom-canvas');\nconst zoomCtx = zoomCanvas.getContext('2d');\nconst zoomLabel = document.getElementById('zoom-label');\nlet dragStart = null, dragEnd = null, isDragging = false;\n\nfunction canvasRatio() { return getParams().w / canvas.width; }\n\ncanvas.addEventListener('mousedown', e => {\n  if (!peaks) return;\n  const rect = canvas.getBoundingClientRect();\n  dragStart = e.clientX - rect.left; dragEnd = dragStart; isDragging = true;\n  selRect.style.display = 'block'; selRect.style.left = dragStart+'px'; selRect.style.width = '0px';\n  wrap.classList.add('selecting');\n});\nwindow.addEventListener('mousemove', e => {\n  if (!isDragging) return;\n  const rect = canvas.getBoundingClientRect();\n  dragEnd = Math.min(Math.max(e.clientX - rect.left, 0), canvas.width);\n  const x = Math.min(dragStart,dragEnd), w = Math.abs(dragEnd-dragStart);\n  selRect.style.left = x+'px'; selRect.style.width = w+'px';\n});\nwindow.addEventListener('mouseup', () => {\n  if (!isDragging) return;\n  isDragging = false; wrap.classList.remove('selecting');\n  if (Math.abs(dragEnd-dragStart) < 4) { selRect.style.display='none'; return; }\n  renderZoom();\n});\n\nfunction renderZoom() {\n  const p = getParams();\n  const ratio = canvasRatio();\n  const x0 = Math.round(Math.min(dragStart,dragEnd)*ratio);\n  const x1 = Math.round(Math.max(dragStart,dragEnd)*ratio);\n  const sliceW = x1 - x0; if (sliceW < 1) return;\n  const off = document.createElement('canvas');\n  off.width = p.w; off.height = p.h;\n  renderToContext(off.getContext('2d'), p.w, p.h, p);\n  zoomCanvas.width = sliceW; zoomCanvas.height = p.h;\n  zoomCanvas.style.width = sliceW+'px'; zoomCanvas.style.height = p.h+'px';\n  zoomCtx.drawImage(off, x0, 0, sliceW, p.h, 0, 0, sliceW, p.h);\n  if (audioDuration > 0) {\n    const totalDur = audioDuration * p.repeat;\n    const t0 = (x0/p.w)*totalDur, t1 = (x1/p.w)*totalDur, dur = t1-t0;\n    const fmt = t => fmtTime(t, p.gridUnit);\n    const fmtDur = d => d>=3600?`${Math.floor(d/3600)}h ${Math.floor((d%3600)/60)}min`:d>=60?`${Math.floor(d/60)}min ${d.toFixed(1)}s`:`${d.toFixed(1)}s`;\n    zoomLabel.textContent = `${fmt(t0)} → ${fmt(t1)}  ·  ${fmtDur(dur)}`;\n  }\n  zoomPanel.style.display = 'flex';\n  zoomPanel.style.width = sliceW+'px';\n}\n\ndocument.getElementById('zoom-close').addEventListener('click', () => {\n  zoomPanel.style.display='none'; selRect.style.display='none'; dragStart=null; dragEnd=null;\n});\n\n// ── File load ─────────────────────────────────────────────────\nasync function loadAudioFile(file) {\n  if (!file) return;\n  audioFilename = file.name.replace(/\\.[^/.]+$/,'');\n  document.getElementById('duration-label').textContent='Chargement…';\n  document.getElementById('drop-hint').style.display='none';\n  const buf = await file.arrayBuffer();\n  const audioCtx = new AudioContext();\n  const decoded = await audioCtx.decodeAudioData(buf);\n  audioDuration = decoded.duration;\n  const samples = Math.max(200, Math.min(4000, +document.getElementById('w').value));\n  peaks = computePeaks(decoded.getChannelData(0), samples);\n  const m=Math.floor(audioDuration/60), s=Math.round(audioDuration%60);\n  document.getElementById('duration-label').textContent=`Durée: ${m}:${String(s).padStart(2,'0')} — ${Math.round(audioDuration)}s`;\n  updateCanvas();\n}\n\ndocument.getElementById('file-input').addEventListener('change', e=>loadAudioFile(e.target.files[0]));\n\nconst uploadBtn=document.getElementById('upload-btn');\n['dragenter','dragover'].forEach(ev=>uploadBtn.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();uploadBtn.classList.add('drag-over');}));\n['dragleave','dragend'].forEach(ev=>uploadBtn.addEventListener(ev,()=>uploadBtn.classList.remove('drag-over')));\nuploadBtn.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();uploadBtn.classList.remove('drag-over');loadAudioFile(e.dataTransfer.files[0]);});\n\n['dragenter','dragover'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();wrap.classList.add('drag-over');}));\n['dragleave','dragend'].forEach(ev=>wrap.addEventListener(ev,()=>wrap.classList.remove('drag-over')));\nwrap.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();wrap.classList.remove('drag-over');loadAudioFile(e.dataTransfer.files[0]);});\n\n// ── Export PNG ────────────────────────────────────────────────\ndocument.getElementById('export-png').addEventListener('click', () => {\n  const p = getParams();\n  const off = document.createElement('canvas');\n  off.width = p.w; off.height = p.h;\n  renderToContext(off.getContext('2d'), p.w, p.h, p);\n  const a = document.createElement('a');\n  a.href = off.toDataURL('image/png');\n  a.download = 'MN_WAVEFORM_GENERATOR_V1.9.png';\n  a.click();\n});\n\n// ── Export SVG ────────────────────────────────────────────────\ndocument.getElementById('export-svg').addEventListener('click', () => {\n  const p = getParams();\n  const W=p.w, H=p.h, sliceW=W/p.repeat;\n  const totalDur = audioDuration * p.repeat;\n  const gIntervalSec = intervalSec(p.gridUnit, p.gridInterval);\n  const tIntervalSec = intervalSec(p.ticksUnit, p.ticksInterval);\n  const tickH = Math.round(H*0.125);\n  let out='';\n\n  // Ticks\n  if (p.gridVisible && p.ticksVisible && audioDuration>0) {\n    let t=0;\n    while(t<=totalDur+tIntervalSec*0.01){\n      const onMain=Math.round(t/gIntervalSec)*gIntervalSec;\n      if(Math.abs(t-onMain)>tIntervalSec*0.01){\n        const x=((t/totalDur)*W).toFixed(1);\n        out+=`<line x1=\"${x}\" y1=\"0\" x2=\"${x}\" y2=\"${tickH}\" stroke=\"${p.gridColor}\" stroke-width=\"0.5\" opacity=\"0.5\"/>\\n`;\n      }\n      t+=tIntervalSec;\n    }\n  }\n  // Main grid\n  if (p.gridVisible && audioDuration>0) {\n    let t=0;\n    while(t<=totalDur+gIntervalSec*0.01){\n      const x=((t/totalDur)*W).toFixed(1);\n      out+=`<line x1=\"${x}\" y1=\"0\" x2=\"${x}\" y2=\"${H}\" stroke=\"${p.gridColor}\" stroke-width=\"1\"/>\\n`;\n      out+=`<text x=\"${(+x+3).toFixed(1)}\" y=\"${p.fontSize+2}\" font-size=\"${p.fontSize}\" fill=\"${p.gridColor}\" font-family=\"system-ui\">${fmtTime(t,p.gridUnit)}<\/text>\\n`;\n      t+=gIntervalSec;\n    }\n  }\n  // Waveform\n  if (peaks) {\n    const samples=peaks.length;\n    for(let r=0;r<p.repeat;r++){\n      const ox=r*sliceW;\n      for(let i=0;i<samples;i++){\n        const x=(ox+Math.round((i/samples)*sliceW)).toFixed(1);\n        const bw=Math.max(1,sliceW/samples).toFixed(1);\n        const amp=peaks[i]*H*0.9;\n        let y,h;\n        if(p.style==='mirror'){h=amp/2;y=(H/2-h).toFixed(1);}\n        else if(p.style==='top'){h=amp;y=(H-amp).toFixed(1);}\n        else{h=amp;y='0';}\n        out+=`<rect x=\"${x}\" y=\"${y}\" width=\"${bw}\" height=\"${Math.max(1,h).toFixed(1)}\" fill=\"${p.waveColor}\"/>\\n`;\n      }\n    }\n  }\n  if(p.filenameVisible&&audioFilename)\n    out+=`<text x=\"6\" y=\"${H-6}\" font-size=\"${p.fontSize}\" fill=\"${p.gridColor}\" font-family=\"system-ui\">${audioFilename}<\/text>\\n`;\n\n  const svg=`<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\">\\n<rect width=\"${W}\" height=\"${H}\" fill=\"${p.bgColor}\"/>\\n${out}<\/svg>`;\n  const blob=new Blob([svg],{type:'image/svg+xml'});\n  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MN_WAVEFORM_GENERATOR_V1.9.svg';a.click();\n});\n\nrenderMain();\n<\/script>\n<\/body>\n<\/html>\n"}];
const ANCIENS_PARCOURS=['Arrivée au studio : stagiaires','Arrivée au studio : freelances','Retour d’un freelance'];
function accueilAFaire(){
  const manq=ACCUEIL.fiches.filter(f=>!parSlug(f.slug));
  const anciens=Object.entries(PARC).filter(([,p])=>p&&ANCIENS_PARCOURS.includes(tr(p.titre,'fr'))).map(([id])=>id);
  const fusion=Object.entries(PARC).find(([,p])=>p&&tr(p.titre,'fr')===ACCUEIL.parcours.titre.fr);
  const parts=[];
  if(manq.length) parts.push(`${manq.length} fiche(s) d’accueil à importer`);
  if(!fusion) parts.push('le parcours « Arrivée au studio » à créer (un seul parcours, filtré par profil)');
  if(anciens.length) parts.push(`${anciens.length} ancien(s) parcours à remplacer`);
  const oManq=OUTILS_PROPOSES.filter(o=>!outilParSlug(o.slug));
  if(oManq.length) parts.push(`${oManq.length} outil(s) à ajouter (${oManq.map(o=>o.titre.fr).join(', ')})`);
  return {manq,anciens,fusion,oManq,afaire:parts.length>0,msg:parts.length?'Accueil : '+parts.join(', ')+'.':''};
}
async function importerAccueil(){
  const a=accueilAFaire();
  if(!confirm(a.msg+'\nLes fiches qui existent déjà ne sont pas modifiées. Continuer ?'))return;
  const now=Date.now(), maj={}, ids={};
  Object.values(FICHES).forEach(f=>{if(f&&f.slug)ids[f.slug]=f.id;});
  a.manq.forEach((f,i)=>{const id=uid('f');ids[f.slug]=id;
    maj['fiches/'+id]={id,slug:f.slug,titre:f.titre,resume:f.resume,contenu:f.contenu,categorie:f.categorie||'Accueil',tags:f.tags,outils:f.outils,
      relireMois:6,relireLe:addMonths(today(),6),archive:false,creeLe:now+i,majLe:now+i,majPar:ME};});
  a.anciens.forEach(id=>{maj['parcours/'+id]=null;});
  const P0=ACCUEIL.parcours, fiches=[], publics={};
  P0.etapes.forEach(e=>{const id=ids[e.slug]; if(!id) return; fiches.push(id); if(e.pour) publics[id]=e.pour;});
  maj['parcours/'+(a.fusion?a.fusion[0]:uid('p'))]={titre:P0.titre,description:P0.description,profils:P0.profils,fiches,publics,ordre:0,majLe:now};
  try{
    for(const o of a.oManq){ const id=uid('o');
      await set(ref(db,'wikiOutilsCode/'+id),o.code); CODE[id]=o.code;
      maj['outils/'+id]={id,slug:o.slug,titre:o.titre,description:o.description,archive:false,fichier:o.fichier,taille:o.code.length,version:1,creeLe:now,majLe:now,majPar:ME}; }
    await update(ref(db,'wiki'),maj);toast('Accueil mis à jour');
  }catch(e){alert('Échec : '+e.message);}
}

const fmtKo=n=>n>1048576?(n/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(n/1024))+' Ko';
const outilParSlug=sl=>Object.values(APPLIS).find(o=>o&&o.slug===sl);

      ${tr(o.description)?`<div class="ir">${esc(tr(o.description))}</div>`:''}<div class="im">${esc(fmtD(o.majLe))}</div></a>`).join('')}</div>`
      :`<div class="empty">${esc(t().outilsVide)}</div>`}`;
  const n=$('#o-new'); if(n) n.onclick=()=>go('oedit',{id:null});
}
async function vOutil(){
  const o=outilParSlug(vue.slug);
  if(!o||(o.archive&&!EDIT)){$('#main').innerHTML=`<div class="empty">${esc(t().outilIntrouvable)} <a href="#outils">${esc(t().choixO)}</a></div>`;return;}
  document.title=tr(o.titre)+' · Wiki';
  $('#main').innerHTML=`<div class="crumb"><a href="#outils">${esc(t().choixO)}</a></div>
    <div class="edbar"><strong style="font-size:22px">${esc(tr(o.titre))}</strong><span class="spacer"></span>
      <button class="btn" id="o-fs">${esc(t().pleinEcran)}</button><button class="btn" id="o-dl">${esc(t().telecharger)}</button>
      ${EDIT?`<button class="btn" id="o-ed">Modifier</button><button class="btn${o.archive?'':' d'}" id="o-ar">${o.archive?'Désarchiver':'Archiver'}</button>`:''}</div>
    ${tr(o.description)?`<p class="hint" style="margin:-8px 0 12px">${esc(tr(o.description))}</p>`:''}
    <div class="ofr" id="ofr"><div class="empty">…</div></div>`;
  if(!(o.id in CODE)){try{CODE[o.id]=(await get(ref(db,'wikiOutilsCode/'+o.id))).val()||'';}catch(e){CODE[o.id]=null;}}
  if(vue.k!=='outil'||vue.slug!==o.slug) return;
  const code=CODE[o.id];

let MODELES={}, SUIVIS={}, PEOPLE_REF=[];
function parseModele(texte){
  const out=[]; let sec='';
  String(texte||'').split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(l.startsWith('## ')) sec=l.slice(3).trim(); else out.push({id:'i'+out.length,section:sec,texte:l.replace(/^[-*]\s+/,'')});
  });
  return out;
}

  const pv=()=>{const it=parseModele($('#md-b').value);let sec=null;
    $('#md-p').innerHTML=`<strong>${esc($('#md-t').value||'Sans titre')}</strong> · ${it.length} étapes`+it.map(i=>{const h=i.section!==sec?`<h3 style="margin:16px 0 6px;font-size:15px">${esc(i.section)}</h3>`:'';sec=i.section;
      return h+`<div style="padding:3px 0">☐ ${esc(i.texte)}</div>`;}).join('');};
  $('#md-b').oninput=pv; $('#md-t').oninput=pv; pv();
  $('#md-x').onclick=()=>go('checklists');
  $('#md-ok').onclick=async()=>{
    const titre=$('#md-t').value.trim(), texte=$('#md-b').value;
    if(!titre||!parseModele(texte).length){alert('Il faut un titre et au moins une étape.');return;}
    try{await set(ref(db,'wikiDirection/modeles/'+(vue.id||uid('m'))),{titre,texte,majLe:Date.now()});toast('Modèle enregistré');go('checklists');}
    catch(e){alert('Échec : '+e.message);}
  };
  const d=$('#md-del'); if(d) d.onclick=async()=>{
    if(!confirm('Supprimer ce modèle ? Les checklists déjà démarrées sont conservées.'))return;
    try{await remove(ref(db,'wikiDirection/modeles/'+vue.id));go('checklists');}catch(e){alert(e.message);}
  };
}

/* ═══ recherche & langue ═══ */
$('#q').oninput=e=>{q=e.target.value.trim(); if(q){ if(location.hash) history.replaceState(null,'',location.pathname); vue={k:'search'}; render(); } else go('home');};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('mn_wiki_lang',L);}catch(_){}
  if(vue.k==='edit'||vue.k==='pedit'){document.querySelectorAll('.lang button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===L));return;}
  render();});
window.addEventListener('beforeunload',e=>{if(vue.k==='edit'&&E){e.preventDefault();e.returnValue='';}});
$('.brand').onclick=e=>{e.preventDefault();q='';$('#q').value='';ctxParc=null;go('home');};
render();
</script>
</body>
</html>
