<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matiere Noire · Outils</title>
<style>
:root{
  --paper:#F7F7F5; --ink:#14161A; --ink2:#5C6169; --ink3:#8C9199;
  --rule:#DDDEDA; --rule2:#EDEEEA; --card:#FFFFFF;
  --live:#2F6F4F; --warn:#B4711E; --stop:#A63A2B;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Helvetica Neue",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

header{padding:44px 26px 0;max-width:940px;width:100%;margin:0 auto}
.mark{font-size:12px;letter-spacing:.34em;text-transform:uppercase;font-weight:600;margin:0}
.mark small{display:block;letter-spacing:.08em;font-size:11px;font-weight:400;color:var(--ink3);
  text-transform:none;margin-top:6px;font-family:var(--mono)}
main{padding:34px 26px 60px;max-width:940px;width:100%;margin:0 auto;flex:1}

h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600;
  margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2::after{content:'';flex:1;height:1px;background:var(--rule)}
section{margin-bottom:34px}

.tools{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.tool{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:17px 18px;
  display:block;transition:border-color .13s,transform .13s}
.tool:hover{border-color:var(--ink);transform:translateY(-1px)}
.tool .t{font-size:15px;font-weight:500;margin-bottom:3px;display:flex;align-items:baseline;gap:8px}
.tool .d{font-size:13px;color:var(--ink2)}
.tool .m{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);margin-top:9px}
.tool.off{opacity:.45;pointer-events:none}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:2px;padding:1px 6px;color:var(--ink3)}
.pill.k{border-color:var(--warn);color:var(--warn)}

.auth{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:17px 18px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.auth .who{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:1}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:3px;padding:6px 13px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink3)}
.btn.p{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.err{color:var(--stop);font-size:12px;width:100%;margin:0}

footer{border-top:1px solid var(--rule);padding:16px 26px;max-width:940px;width:100%;margin:0 auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink3);
  display:flex;gap:16px;flex-wrap:wrap}
@media(max-width:600px){header{padding-top:30px}main{padding-top:26px}}
</style>
</head>
<body>

<header>
  <h1 class="mark">Matiere Noire<small>Outils internes du studio</small></h1>
</header>

<main>
  <section>
    <h2>Pour tout le monde</h2>
    <div class="tools" id="pub"></div>
  </section>

  <section id="sec-dir">
    <h2>Direction</h2>
    <div id="auth-box"></div>
    <div class="tools" id="dir" style="margin-top:11px"></div>
  </section>
</main>

<footer>
  <span>Matiere Noire · Paris</span>
  <span id="ft"></span>
</footer>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

/* ═══ à ajuster si un repo change de nom ═══ */
const BASE='https://baptiste-mn.github.io';
const PUBLIC=[
  {t:'Time tracking',d:'Saisir ses heures, projet par projet.',u:BASE+'/time-matiere-noire/'},
  {t:'Congés',d:'Poser une absence et suivre ses soldes.',u:BASE+'/conges-matiere-noire/'},
  {t:'Planning',d:'Le planning partagé du studio.',u:BASE+'/planning-matiere-noire/'},
  {t:'Notes',d:'Tableau de notes partagé par toute l’équipe.',u:BASE+'/notes-matiere-noire/'},
  {t:'Wiki',d:'Les fiches pratiques du studio : outils, démarches, matériel.',u:BASE+'/wiki-matiere-noire/'},
];
const DIRECTION=[
  {t:'Récap projets',d:'Marge des projets actifs, et son évolution sur 7 jours.',u:BASE+'/project-recap/'},
  {t:'Rentabilité',d:'Marge par projet, par phase et par personne.',u:BASE+'/dashboard-matiere-noire/'},
  {t:'Administration',d:'Personnes, projets, devis, CJM, alias.',u:BASE+'/admin-matiere-noire/'},
  {t:'Bulletins de stage',d:'Gratifications mensuelles des stagiaires, export PDF.',u:BASE+'/paie-matiere-noire/'},
];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const carte=(x,off)=>`<a class="tool${off?' off':''}" ${off?'':`href="${esc(x.u)}"`}>
  <div class="t">${esc(x.t)}${off?'<span class="pill k">verrouillé</span>':''}</div>
  <div class="d">${esc(x.d)}</div></a>`;

document.querySelector('#pub').innerHTML=PUBLIC.map(x=>carte(x,false)).join('');

const CFG={apiKey:"AIzaSyByf4SmnGJvfkkJVFhfINXikb8I8ge5VRU",
  authDomain:"matiere-noire-todo.firebaseapp.com",
  databaseURL:"https://matiere-noire-todo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"matiere-noire-todo",storageBucket:"matiere-noire-todo.firebasestorage.app",
  messagingSenderId:"583651643354",appId:"1:583651643354:web:74b78c43316b9d657dfae3"};
const auth=getAuth(initializeApp(CFG));

/* ═══ MN-GATE v1 — connexion Google obligatoire, liste d'accès /acces ═══
   Bloc identique dans tous les outils : à modifier partout à la fois.
   Session conservée par Firebase (même domaine) : une connexion vaut pour tous les outils. */
async function mnGate(){
  const B='https://www.gstatic.com/firebasejs/10.12.0/';
  const [F,A,D]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-database.js')]);
  const app=F.getApp(), auth=A.getAuth(app), db=D.getDatabase(app);
  const g=document.createElement('div'); g.id='mn-gate';
  g.innerHTML=`<style>
#mn-gate{position:fixed;inset:0;z-index:2147483000;background:#F7F7F5;color:#14161A;display:flex;align-items:center;justify-content:center;
  font-family:"Helvetica Neue",Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;padding:24px;box-sizing:border-box}
#mn-gate .mg{max-width:380px;width:100%}
#mn-gate .mg-t{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
#mn-gate .mg-s{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:#8C9199;margin:0 0 22px}
#mn-gate .mg-m{margin:0 0 16px;color:#5C6169}
#mn-gate .mg-m b{color:#14161A;font-weight:600}
#mn-gate .mg-m.err{color:#A63A2B}
#mn-gate button{font:inherit;font-size:13px;border:1px solid #14161A;background:#14161A;color:#F7F7F5;border-radius:3px;padding:8px 16px;cursor:pointer;margin:0 8px 8px 0}
#mn-gate button.sec{background:transparent;color:#14161A;border-color:#DDDEDA}
#mn-gate button:hover{opacity:.85}
</style><div class="mg"><div class="mg-t">Matiere Noire</div><div class="mg-s"></div><div class="mg-m"></div><div class="mg-a"></div></div>`;
  document.body.appendChild(g);
  g.querySelector('.mg-s').textContent=document.title||'';
  const msg=(h,err)=>{const m=g.querySelector('.mg-m');m.innerHTML=h;m.className='mg-m'+(err?' err':'');};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const btns=list=>{const a=g.querySelector('.mg-a');a.innerHTML='';
    list.forEach(([t,f,sec])=>{const b=document.createElement('button');b.textContent=t;if(sec)b.className='sec';b.onclick=f;a.appendChild(b);});};
  const login=async()=>{
    try{const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await A.signInWithPopup(auth,p);}
    catch(e){
      if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'))return;
      msg(location.protocol==='file:'
        ?'Connexion impossible depuis un fichier local : ouvrez la page en ligne.'
        :e&&e.code==='auth/popup-blocked'
          ?'La fenêtre de connexion a été bloquée par le navigateur. Autorisez les pop-ups pour ce site, puis réessayez.<br>Pop-up blocked: allow pop-ups for this site and retry.'
          :'Connexion impossible · Sign-in failed<br><small>'+esc(e&&(e.code||e.message))+'</small>',true);
    }
  };
  const ecranConnexion=()=>{msg('Connectez-vous avec votre compte <b>@matiere-noire.paris</b>.<br>Sign in with your Matiere Noire Google account.');
    btns([['Se connecter avec Google · Sign in',login]]);};
  msg('Chargement…'); btns([]);
  return new Promise(resolve=>{
    let ok=false;
    A.onAuthStateChanged(auth,async u=>{
      if(ok){ if(!u) location.reload(); return; }      // déconnexion après ouverture : on revient à l'écran de connexion
      if(!u){ecranConnexion();return;}
      msg('Vérification de l’accès…'); btns([]);
      const email=(u.email||'').toLowerCase();
      let autorise=false, erreur=null;
      try{
        autorise=!!u.emailVerified && (await D.get(D.ref(db,'acces/'+email.replace(/\./g,',')))).exists();
      }catch(e){
        if(!/permission/i.test(e&&e.message||'')) erreur=e;  // permission refusée = compte non autorisé
      }
      if(autorise){ok=true;g.remove();resolve(u);return;}
      if(erreur){msg('Impossible de vérifier l’accès (connexion internet ?) · Could not check access.<br><small>'+esc(erreur.message)+'</small>',true);
        btns([['Réessayer · Retry',()=>location.reload()],['Changer de compte',login,true]]);return;}
      msg('<b>'+esc(email)+'</b> n’a pas accès à la plateforme. Demandez l’accès à Baptiste.<br>This account has no access. Ask Baptiste.',true);
      btns([['Changer de compte · Switch account',login],['Se déconnecter',()=>A.signOut(auth),true]]);
    });
  });
}
/* ═══ fin MN-GATE v1 ═══ */
await mnGate();

/* ═══ Accès direction — à garder identique aux règles Firebase et à conges.html ═══ */
const ADMINS=[
  'baptiste@matiere-noire.paris',
  'felix@matiere-noire.paris',
  'pierre@matiere-noire.paris',
  'sam@matiere-noire.paris'
];
const estAdmin=u=>!!u&&u.emailVerified&&ADMINS.includes((u.email||'').toLowerCase());

function box(u,err){
  const ok=estAdmin(u);
  document.querySelector('#auth-box').innerHTML = u
    ? `<div class="auth"><span class="who">${ok?'Connecté · '+esc(u.email):esc(u.email)+' — accès non autorisé'}</span>
        <button class="btn" id="out">Se déconnecter</button></div>`
    : `<div class="auth"><span class="who">Espace réservé à la direction — coûts, marges et administration.</span>
        <button class="btn p" id="in">Se connecter avec Google</button>
        ${err?`<p class="err">${esc(err)}</p>`:''}</div>`;
  const i=document.querySelector('#in'), o=document.querySelector('#out');
  if(i) i.onclick=async()=>{
    try{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await signInWithPopup(auth,p);}
    catch(e){box(null, location.protocol==='file:'
      ? "Connexion impossible depuis un fichier local : ouvrez la page en ligne."
      : "Connexion refusée. Utilisez votre compte @matiere-noire.paris.");}
  };
  if(o) o.onclick=()=>signOut(auth);
}
onAuthStateChanged(auth,u=>{
  const ok=estAdmin(u);
  box(u);
  // les outils de direction ne s'affichent que pour les comptes autorisés
  document.querySelector('#sec-dir').style.display = ok||!u ? '' : '';
  const mail=((u&&u.email)||'').toLowerCase();
  document.querySelector('#dir').innerHTML = ok ? DIRECTION.filter(x=>!x.only||x.only.includes(mail)).map(x=>carte(x,false)).join('') : '';
  document.querySelector('#ft').textContent = ok ? 'session ouverte' : 'accès direction verrouillé';
});
box(null);
</script>
</body>
</html>
